name: Verify framework
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        working-directory: backend
        run: mvn -B -ntp verify
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json
      - name: Install, lint and build
        working-directory: frontend/admin-web
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run build
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json
      - name: Install, type-check and build both targets
        working-directory: frontend/mobile
        run: |
          npm ci
          npm run format:check
          npm run type-check
          npm run build:h5
          npm run build:mp-weixin
